name: Secrets Check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    env:
      # Optional comma-separated regex of deployment-specific names. Keep the
      # actual values in the repository secret, never in this file.
      PII_PATTERNS: ${{ secrets.PII_PATTERNS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for committed config and key material
        run: |
          set -e
          if git ls-files | grep -E '(^|/)\.env($|\.)|\.(key|pem|p12|pfx)$'; then
            echo "ERROR: environment/key file is tracked"
            exit 1
          fi
          echo "No tracked .env/key files ✅"
      - name: Check for private IPs and local domains
        run: |
          set -e
          if git grep -I -n -E '(^|[^0-9])(10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3})' -- . ':!*.md'; then
            echo "ERROR: private RFC1918 address in tracked source"
            exit 1
          fi
          if git grep -I -n -E '[A-Za-z0-9-]+\.(local|internal|lan)([^A-Za-z0-9-]|$)' -- . ':!*.md'; then
            echo "ERROR: local/private domain in tracked source"
            exit 1
          fi
          echo "No private addresses/domains in source ✅"
      - name: Check deployment-specific names (optional secret)
        if: ${{ env.PII_PATTERNS != '' }}
        run: |
          set -e
          if git grep -I -n -i -E "$PII_PATTERNS" -- . ':!*.png' ':!*.jpg' ':!LICENSE'; then
            echo "ERROR: deployment-specific PII pattern found"
            exit 1
          fi
          echo "No configured PII patterns found ✅"
      - name: Check for private data in history (optional secret)
        if: ${{ env.PII_PATTERNS != '' }}
        run: |
          set -e
          # A push check must cover the added range, not only the working tree.
          git log -p --no-color -i --format='commit %H' -G"$PII_PATTERNS" -- . ':!*.png' ':!*.jpg' ':!LICENSE' >/tmp/pii-history.txt || true
          if [ -s /tmp/pii-history.txt ]; then
            echo "ERROR: deployment-specific PII pattern found in history"
            exit 1
          fi
          echo "No configured PII patterns in history ✅"
