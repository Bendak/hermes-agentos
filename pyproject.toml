[project]
name = "agentos"
version = "0.1.0"
description = "Self-hosted web dashboard for the Hermes Agent: sessions, kanban, cron, workflows, profiles and analytics."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "aiosqlite>=0.19",
    "pydantic>=2",
    "pydantic-settings>=2",
    "httpx>=0.27",
    "PyYAML>=6",
    "python-multipart>=0.0.9",
    # used by the Hermes cron store for next_run_at computation (WI-1)
    "croniter>=2",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
